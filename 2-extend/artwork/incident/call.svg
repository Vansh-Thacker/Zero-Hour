<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Incoming support call: “I need your MFA code to fix this.”</title><desc id="desc">IT Support (caller label) Identity not independently verified “I need your MFA code to fix this.” The caller knows your name and department. They ask you to keep this call open. A separate company directory is available.</desc><rect width="1280" height="720" fill="#eaf0f4"/><rect x="36" y="34" width="1208" height="652" rx="20" fill="white" stroke="#cad8df"/><path d="M56 34h1168q20 0 20 20v70H36V54q0-20 20-20" fill="#083529"/><text x="72" y="90" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="white">Incoming support call</text><text x="1204" y="87" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#ccebdd">FICTIONAL EXERCISE</text><g font-family="Arial,sans-serif"><text x="88" y="184" font-size="30" font-weight="bold" fill="#083529">IT Support (caller label)</text><text x="88" y="228" font-size="23" fill="#536d7e">Identity not independently verified</text><path d="M88 258H1190" stroke="#d4dfe5"/><text x="88" y="316" font-size="32" font-weight="bold" fill="#112c40">“I need your MFA code to fix this.”</text><text x="88" y="370" font-size="25" fill="#223d50">The caller knows your name and department.</text><text x="88" y="428" font-size="25" fill="#223d50">They ask you to keep this call open.</text><text x="88" y="486" font-size="25" fill="#223d50">A separate company directory is available.</text></g></svg>