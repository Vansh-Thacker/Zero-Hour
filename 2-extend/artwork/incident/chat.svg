<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Work chat: “I was worried I would get blamed.”</title><desc id="desc">Colleague 02:15 | Incident discussion “I was worried I would get blamed.” I clicked the supplier link earlier. I can give you the time and which device I used. I hesitated to report it. What should I do now?</desc><rect width="1280" height="720" fill="#eaf0f4"/><rect x="36" y="34" width="1208" height="652" rx="20" fill="white" stroke="#cad8df"/><path d="M56 34h1168q20 0 20 20v70H36V54q0-20 20-20" fill="#083529"/><text x="72" y="90" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="white">Work chat</text><text x="1204" y="87" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#ccebdd">FICTIONAL EXERCISE</text><g font-family="Arial,sans-serif"><text x="88" y="184" font-size="30" font-weight="bold" fill="#083529">Colleague</text><text x="88" y="228" font-size="23" fill="#536d7e">02:15 | Incident discussion</text><path d="M88 258H1190" stroke="#d4dfe5"/><text x="88" y="316" font-size="32" font-weight="bold" fill="#112c40">“I was worried I would get blamed.”</text><text x="88" y="370" font-size="25" fill="#223d50">I clicked the supplier link earlier.</text><text x="88" y="428" font-size="25" fill="#223d50">I can give you the time and which device I used.</text><text x="88" y="486" font-size="25" fill="#223d50">I hesitated to report it. What should I do now?</text></g></svg>