<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Hour preview</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Preview page only: lets Vansh try the theme without the rest of the game. */
  body { margin: 0; padding: 16px; background: #0a1a2e; color: #dbe8f7; font-family: system-ui, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .controls button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 2px solid #dbe8f7; background: transparent; color: inherit; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: #dbe8f7; color: #0a1a2e; }
  .note { color: #8fa8c4; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Zero Hour: theme preview</h1>
  <p class="note">Uses the real challenge.json. Not part of the game: only for trying the theme on its own.</p>
  <div class="controls" id="controls"></div>
  <div id="heist"></div>

<script type="module">
import { renderTheme } from './theme.mjs';
import { buyableControls } from './vault.mjs';

const data = await (await fetch('../../1-foundation/data/challenge.json')).json();

// Two sample teams to compare: the best control in every layer for phase 1, and the cheapest valid choice.
const byCategory = category => buyableControls(data).filter(c => c.category === category);
const bestInPhase1 = category => byCategory(category).sort((a, b) =>
  (data.phases[0].scores[b.id] ?? 0) - (data.phases[0].scores[a.id] ?? 0))[0].id;
const cheapest = category => byCategory(category).sort((a, b) => a.cost - b.cost)[0].id;

const teams = {
  'Strong team': ['Prevent', 'Detect', 'Respond'].map(bestInPhase1),
  'Cheapest team': ['Prevent', 'Detect', 'Respond'].map(cheapest),
};

let team = 'Strong team';
let phaseIndex = 0;
let showOutcome = false;

function draw() {
  const buttons = [
    ...Object.keys(teams).map(name =>
      `<button data-team="${name}" aria-pressed="${name === team}">${name}</button>`),
    ...data.phases.map((_, i) =>
      `<button data-phase="${i}" aria-pressed="${i === phaseIndex && !showOutcome}">Phase ${i + 1}</button>`),
    `<button data-outcome aria-pressed="${showOutcome}">Ending</button>`,
  ];
  document.getElementById('controls').innerHTML = buttons.join('');

  const state = { chosen: teams[team], phaseIndex: showOutcome ? data.phases.length - 1 : phaseIndex };
  renderTheme(document.getElementById('heist'), state, data, { showOutcome });
}

document.getElementById('controls').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.team) team = button.dataset.team;
  if (button.dataset.phase) { phaseIndex = Number(button.dataset.phase); showOutcome = false; }
  if ('outcome' in button.dataset) showOutcome = true;
  draw();
});

draw();
</script>
</body>
</html>
